services:
  casting:
    build: .
    image: wg-casting
    container_name: wg-casting
    ports:
      # Nur an localhost binden: öffentlich erreichbar ausschließlich über den
      # Caddy-Reverse-Proxy (HTTPS, https://casting.thhaase.de). Direkter Zugriff
      # auf IP:8000 aus dem Internet ist damit dicht.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data         # SQLite-DB (Votes, Termine, Bewerber:innen, KI-Key)
    environment:
      # Gemeinsamer WG-Zugangscode (Seite + Backend).
      ACCESS_CODE: "${ACCESS_CODE:-wg-casting}"
      # Die 5 Mitbewohner:innen, kommagetrennt (setzt FLATMATES in der Seite).
      FLATMATES: "${FLATMATES:-}"
      # Default-Gemini-Modell (kann in der App überschrieben werden).
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-flash-latest}"
    restart: unless-stopped
